# MainUI-Android: builds ARMSX3 with the MainUI State API and publishes it for MainUI.
# Nightly at 00:00 PST: merges upstream, builds "nightly" (prerelease); when upstream has a new
# release, also builds it with the patch on top as a stable release, which MainUI installs.
# Signing: organization secrets MAINUI_KEYSTORE (base64), MAINUI_KEYSTORE_PASSWORD,
# MAINUI_KEY_ALIAS, MAINUI_KEY_PASSWORD. Helpers: .github/mainui/ci.sh.
name: MainUI

on:
  push:
    branches: [master]
    paths-ignore: ['**.md']
  schedule:
    # 02:00 PST: after the nightly maintenance session (00:00 PST), which merges upstream and fixes
    # what doesn't merge; this merges again if it hasn't, and builds what isn't built yet.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: mainui
  cancel-in-progress: false

env:
  UPSTREAM_REPO: ARMSX2/ARMSX3
  UPSTREAM_BRANCH: master
  STABLE_TAG_REGEX: '^v?[0-9]+(\.[0-9]+)+$'
  GH_TOKEN: ${{ github.token }}
  APK_NAME: armsx3-mainui

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
      tag: ${{ steps.stable.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upstream's workflows off
        run: bash .github/mainui/ci.sh quiet-upstream-ci
      - name: Merge upstream
        if: github.event_name == 'schedule'
        run: bash .github/mainui/ci.sh sync
      - name: Upstream release to build
        id: stable
        if: github.event_name != 'push'
        run: bash .github/mainui/ci.sh stable-tag
      - name: Plan
        id: plan
        run: |
          # Nightly: unless this is the schedule and "nightly" is this commit's build already.
          c=()
          if [ "${{ github.event_name }}" != schedule ] || [ "$(git ls-remote origin refs/tags/nightly | cut -f1)" != "$(git rev-parse HEAD)" ]; then c+=('"nightly"'); fi
          if [ -n "${{ steps.stable.outputs.tag }}" ]; then c+=('"stable"'); fi
          echo "channels=[$(IFS=,; echo "${c[*]}")]" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.channels != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    # (The core's build follows upstream's armsx3.yml.)
    env:
      NDK_VERSION: 29.0.14206865
      CMAKE_VERSION: 3.30.5
      CCACHE_VERSION: 4.14.3
      CCACHE_SHA256: e4583fd653b794a480b9915358679a75cdd7a7010dd865eaf4cbdc61e665a3f0
      ANDROID_API: 33
      ARM_MARCH: armv8.2-a+dotprod+fp16
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
      - name: Stable source (upstream release + patch)
        if: matrix.channel == 'stable'
        run: bash .github/mainui/ci.sh prepare-stable "${{ needs.plan.outputs.tag }}"
      # (upstream's ec20048, newer than 1.6.7: builds without the Discord SDK, which isn't in the repository)
      - name: Stable without the Discord SDK
        if: matrix.channel == 'stable'
        run: |
          grep -q 'EXISTS.*libdiscord_partner_sdk' android/armsx3-ui/app/src/main/cpp/CMakeLists.txt ||
            git show ec2004843c2204353c1153c2cc971cfca70ae3fd | git apply
      - name: Submodules
        run: git submodule update --init --recursive --jobs 8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install the NDK, CMake and ccache
        run: |
          yes | sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" >/dev/null || true
          ccache_dir="ccache-${CCACHE_VERSION}-linux-x86_64-musl-static"
          curl -fsSL --retry 5 -o ccache.tar.gz \
            "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${ccache_dir}.tar.gz"
          echo "${CCACHE_SHA256}  ccache.tar.gz" | sha256sum -c -
          tar -xzf ccache.tar.gz
          sudo install "${ccache_dir}/ccache" /usr/local/bin/ccache
          rm -rf ccache.tar.gz "${ccache_dir}"
      - name: Restore FFmpeg
        uses: actions/cache@v4
        with:
          path: build-ffmpeg
          key: android-ffmpeg-${{ hashFiles('android/build-ffmpeg.sh', 'android/ffmpeg.cmake') }}
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-mainui-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: |
            ccache-mainui-${{ matrix.channel }}-
            ccache-mainui-
      - name: Fetch the librashader header
        run: |
          pin="$(sed -n 's/^PIN=//p' ios/scripts/build-librashader-ios.sh)"
          git init -q 3rdparty/librashader
          git -C 3rdparty/librashader fetch -q --depth 1 https://github.com/SnowflakePowered/librashader.git "$pin"
          git -C 3rdparty/librashader checkout -q FETCH_HEAD
      - name: Fetch libadrenotools
        run: |
          dir=android/armsx3-ui/app/src/main/cpp/libadrenotools
          git init -q $dir
          git -C $dir fetch -q --depth 1 https://github.com/bylaws/libadrenotools.git 8fae8ce254dfc1344527e05301e43f37dea2df80
          git -C $dir checkout -q FETCH_HEAD
          git -C $dir submodule update -q --init --depth 1
      - name: Configure the core
        run: bash android/stamp-git-version.sh && bash android/configure.sh -DARMSX3_ARM_MARCH=$ARM_MARCH
      - name: Build the core
        run: |
          export PATH="$ANDROID_HOME/cmake/$CMAKE_VERSION/bin:$PATH"
          targets=android/libarmsx3-core.so
          if ninja -C build-android -t targets all | grep -q '^armsx3_lsfg:'; then targets="$targets armsx3_lsfg"; fi
          timeout 19000 ninja -C build-android $targets
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Stage the native libraries
        run: |
          strip="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          ui=android/armsx3-ui/app/src
          mkdir -p $ui/main/jniLibs/arm64-v8a $ui/github/jniLibs/arm64-v8a
          "$strip" --strip-unneeded -o $ui/main/jniLibs/arm64-v8a/libarmsx3-core.so build-android/android/libarmsx3-core.so
          lsfg=build-android/3rdparty/lsfg/libarmsx3_lsfg.so
          if [ -f "$lsfg" ]; then "$strip" --strip-unneeded -o $ui/github/jniLibs/arm64-v8a/libarmsx3_lsfg.so "$lsfg"; fi
      - name: Version
        run: bash .github/mainui/ci.sh version "${{ matrix.channel }}" "${{ needs.plan.outputs.tag }}"
      - name: Build the APK
        working-directory: android/armsx3-ui
        env:
          CFLAGS: -w
          CXXFLAGS: -w
        run: ./gradlew :app:assembleGithubRelease -Parmsx3.minSdk=$ANDROID_API -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --stacktrace
      - name: Sign
        id: sign
        env:
          MAINUI_KEYSTORE: ${{ secrets.MAINUI_KEYSTORE }}
          MAINUI_KEYSTORE_PASSWORD: ${{ secrets.MAINUI_KEYSTORE_PASSWORD }}
          MAINUI_KEY_ALIAS: ${{ secrets.MAINUI_KEY_ALIAS }}
          MAINUI_KEY_PASSWORD: ${{ secrets.MAINUI_KEY_PASSWORD }}
        run: |
          apk=$(ls android/armsx3-ui/app/build/outputs/apk/github/release/*.apk | head -1)
          cp "$apk" "$APK_NAME-unsigned.apk"
          set +e; bash .github/mainui/ci.sh sign "$apk" "$APK_NAME.apk"; rc=$?; set -e
          if [ $rc = 0 ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; elif [ $rc != 2 ]; then exit $rc; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}-${{ matrix.channel }}
          path: ${{ env.APK_NAME }}*.apk
          retention-days: 14
      - name: Release
        if: steps.sign.outputs.signed == 'true'
        run: bash .github/mainui/ci.sh release "${{ matrix.channel }}" "${{ needs.plan.outputs.tag }}" "$APK_NAME.apk"
